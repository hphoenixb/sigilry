[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigilry"
version = "0.1.0"
description = "Bind a sigil you drew into a living process: it labors, keeps celestial hours, records its life, and dissolves irrecoverably."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hunter" }]
keywords = ["technomancy", "sigil", "daemon", "planetary-hours", "proof-of-work"]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sigil = "sigilry.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sigilry*"]
